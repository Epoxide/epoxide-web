name: CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true
jobs:
  lint: 
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run linting
        run: pnpm lint
      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: pnpm exec commitlint --from HEAD~1 --to HEAD --verbose
      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run type check
        run: pnpm check
  test:
    name: Playwright test
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.54.2-noble # Match the version in package.json
      options: --user 1001
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        id: test
        run: pnpm -r --workspace-concurrency=1 --no-bail --if-present test
        continue-on-error: true
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        id: artifact-upload
        if: always()
        with:
          name: playwright-report
          path: packages/*/playwright-report/
          retention-days: 30
          if-no-files-found: ignore
      - name: Detect snapshot failures
        id: snapshots
        if: always() && github.event_name == 'pull_request'
        run: node .github/scripts/detect-snapshot-failures.mjs packages/*/playwright-json/results.json >> "$GITHUB_OUTPUT"
      - name: Update PR snapshot comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- playwright-snapshots -->'
            const { owner, repo } = context.repo
            const prNumber = context.payload.pull_request.number
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: prNumber })
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id })
            }
            if ('${{ steps.snapshots.outputs.failed }}' === 'true') {
              const reportUrl = '${{ steps.artifact-upload.outputs.artifact-url }}' || `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`
              const updateUrl = `https://github.com/${owner}/${repo}/actions/workflows/update-snapshots.yml`
              const body = [
                marker,
                '## 📸 Visual snapshot tests failed',
                '',
                'Screenshots no longer match the stored baselines. This could be an intentional UI change or a regression.',
                '',
                `**[View Playwright report](${reportUrl})**`,
                '',
                `To update the snapshots, run \`pnpm update-snapshots\` locally or comment \`/update-snapshots\` on this PR or [run the Update Snapshots workflow](${updateUrl}) with PR number \`${prNumber}\`.`,
              ].join('\n')
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body })
            }
      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1
  check-deploy:
    name: Check if deploy is needed
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      deployNext: ${{ steps.checkCommitMessagesForNextChanges.outputs.deployNext }}
    permissions: read-all
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get last workflow run SHA
        id: lastWorkflowRun
        run: |
          export SHA=$(gh run list --branch main --json headSha,conclusion | jq -r 'map(select(.conclusion == "success")) | .[0].headSha')
          echo "lastWorkflowRunSha=$SHA" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check commit messages for Next changes
        id: checkCommitMessagesForNextChanges
        run: |
          if git log --pretty=format:"%s" ${{ steps.lastWorkflowRun.outputs.lastWorkflowRunSha }}..HEAD | grep -q -E '\(next\):|^feat:|^fix:|^ci:|^refactor:|^chore:'; then
            echo "Commit messages since last deploy contain a repo wide or Next change"
            echo "deployNext=true" >> "$GITHUB_OUTPUT"
          else
            echo "Commit messages since last deploy do not contain a repo wide or Next change"
            echo "deployNext=false" >> "$GITHUB_OUTPUT"
          fi
  changes-since-last-deploy:
    name: Compare changes since last deploy
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, check-deploy]
    if: ${{ needs.check-deploy.outputs.deployNext == 'true' }}
    environment:
      name: github
      url: ${{steps.changes.outputs.url}}
    permissions: read-all
    steps:
      - uses: actions/checkout@v7
      - name: Changes since last deploy
        id: changes
        run: |
          export SHA=$(gh run list --json databaseId | jq -r ".[] | .databaseId" | while read -r run_id; do gh run view $run_id --json jobs,headSha | jq -r '. | select(.jobs[] | .name == "Deploy to production" and .status == "completed" and .conclusion == "success") | .headSha' | grep . && break; done | head -n 1)
          echo "url=https://github.com/${{ github.repository }}/compare/$SHA...${{ github.sha }}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [changes-since-last-deploy]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://epoxide.se
    concurrency:
      group: production
      cancel-in-progress: true
    steps:
      - name: Trigger Coolify deployment
        run: |
          curl --request GET '${{ secrets.COOLIFY_WEBHOOK_URL }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}'
